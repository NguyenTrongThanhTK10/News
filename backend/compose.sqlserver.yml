services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - tin24-sql-data:/var/opt/mssql
    restart: unless-stopped
volumes:
  tin24-sql-data:
